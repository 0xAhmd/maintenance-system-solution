<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<link rel="stylesheet" href="main.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="bi bi-gear-fill text-primary" style="font-size: 64px;"></i>
                <h2 class="fw-bold mt-3">نظام إدارة الصيانة</h2>
                <p class="text-muted">تسجيل الدخول إلى حسابك</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">البريد الإلكتروني</label>
                    <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">تسجيل الدخول كـ</label>
                    <select class="form-select" id="userRole">
                        <option value="admin">مدير</option>
                        <option value="mechanic">ميكانيكي</option>
                        <option value="driver">سائق</option>
                    </select>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">تذكرني</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-left me-2"></i>تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('userRole').value;
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', role);
            
            // Redirect based on role
            if (role === 'admin') {
                window.location.href = 'dashboard.html';
            } else if (role === 'mechanic') {
                window.location.href = 'mechanic-tasks.html';
            } else if (role === 'driver') {
                window.location.href = 'my-vehicle.html';
            }
        });
    </script>
</body>
</html>
