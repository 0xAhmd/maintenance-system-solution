<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العربيات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Sidebar (same as dashboard) -->
    <div class="sidebar">
        <div class="sidebar-brand text-white">
            <h4 class="fw-bold"><i class="bi bi-gear-fill me-2"></i>نظام الصيانة</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-speedometer2 me-2"></i>لوحة التحكم
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="vehicles.html">
                    <i class="bi bi-car-front me-2"></i>العربيات
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="users.html">
                    <i class="bi bi-people me-2"></i>المستخدمين
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="spare-parts.html">
                    <i class="bi bi-gear me-2"></i>قطع الغيار
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="maintenance.html">
                    <i class="bi bi-tools me-2"></i>الصيانة
                </a>
            </li>
        </ul>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <h5 class="mb-0">إدارة العربيات</h5>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>تسجيل خروج
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="fw-bold mb-4">
            <i class="bi bi-car-front text-primary me-2"></i>إدارة العربيات
        </h2>

        <div class="card">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <span class="fw-semibold">قائمة العربيات</span>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
                    <i class="bi bi-plus-circle me-2"></i>إضافة عربية
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>الموديل</th>
                                <th>رقم اللوحة</th>
                                <th>المالك</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#001</td>
                                <td>تويوتا كامري</td>
                                <td><span class="badge bg-secondary">ABC 123</span></td>
                                <td>أحمد محمد</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-2" onclick="editVehicle(1)">
                                        <i class="bi bi-pencil"></i> تعديل
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteVehicle(1)">
                                        <i class="bi bi-trash"></i> حذف
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>#002</td>
                                <td>هوندا أكورد</td>
                                <td><span class="badge bg-secondary">XYZ 456</span></td>
                                <td>فاطمة علي</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-2" onclick="editVehicle(2)">
                                        <i class="bi bi-pencil"></i> تعديل
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteVehicle(2)">
                                        <i class="bi bi-trash"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Vehicle Modal -->
    <div class="modal fade" id="addVehicleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">إضافة عربية جديدة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addVehicleForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">الموديل</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">رقم اللوحة</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">المالك</label>
                            <select class="form-select" required>
                                <option value="">اختر المالك</option>
                                <option>أحمد محمد</option>
                                <option>فاطمة علي</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveVehicle()">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        function saveVehicle() {
            alert('تم إضافة العربية بنجاح!');
            bootstrap.Modal.getInstance(document.getElementById('addVehicleModal')).hide();
        }
        function editVehicle(id) {
            alert('تعديل العربية #' + id);
        }
        function deleteVehicle(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                alert('تم حذف العربية #' + id);
            }
        }
    </script>
</body>
</html>
